name: Release

on:
  push:
    tags:
      - "v*.*.*"

# miao fork patch：只出 Windows onedir 压缩包（flaresolverr_windows_x64.zip）。
# 用内置 GITHUB_TOKEN 取代上游的 GH_PAT：fork 后无需配置任何 secret，
# release 与资产自动归属当前仓库。创建 release / 上传资产需要 contents: write。
permissions:
  contents: write

jobs:
  create-release:
    name: Create release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build changelog
        id: github_changelog
        run: |
          changelog=$(git log $(git tag | tail -2 | head -1)..HEAD --no-merges --oneline)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.github_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-package:
    name: Build Windows onedir zip
    needs: create-release
    # miao fork patch：上游是 ubuntu-22.04 + windows-latest 矩阵（linux 出
    # flaresolverr_linux_x64.tar.gz）。这里只要 Windows 的 onedir 压缩包，
    # 产物是 dist/flaresolverr_windows_x64.zip，下面的 glob 仍然匹配。
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build artifacts
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.22.2
          cd src
          python build_package.py

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/flaresolverr_*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
